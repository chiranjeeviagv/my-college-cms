<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Catalog</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-8">

    <!-- Global Navigation Menu -->
    <div class="container mx-auto max-w-4xl mb-6 flex justify-between items-center border-b bg-white p-4 rounded-lg shadow-sm">
<div class="flex space-x-4">
    <a th:href="@{/}" class="text-gray-600 hover:text-blue-600 font-medium pb-2">Students</a>
    <a th:href="@{/professors}" class="text-gray-600 hover:text-blue-600 font-medium pb-2">Faculty</a>
    <a th:href="@{/courses}" class="text-gray-600 hover:text-blue-600 font-medium pb-2">Courses</a>
    <a th:href="@{/grades}" class="text-gray-600 hover:text-blue-600 font-medium pb-2">Grades</a>
</div>
        <div class="flex space-x-2">
            <a th:href="@{/courses/enroll}" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded shadow text-sm">
                Enroll Student
            </a>
            <a th:href="@{/courses/add}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow text-sm">
                + Add Course
            </a>
        </div>
    </div>

    <!-- Main Course Catalog Content -->
    <div class="container mx-auto max-w-4xl bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Course Management</h1>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200 rounded-lg overflow-hidden">
                <thead>
                    <tr class="bg-gray-800 text-white text-left text-sm uppercase tracking-wider">
                        <th class="px-5 py-3">Code</th>
                        <th class="px-5 py-3">Title</th>
                        <th class="px-5 py-3">Credits</th>
                        <th class="px-5 py-3">Enrolled Count</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="course : ${courses}" class="border-b border-gray-200 hover:bg-gray-50 text-gray-700">
                        <td class="px-5 py-4 font-bold text-blue-600" th:text="${course.courseCode}">CS101</td>
                        <td class="px-5 py-4 font-medium" th:text="${course.title}">Data Structures</td>
                        <td class="px-5 py-4" th:text="${course.credits}">4</td>
                        <td class="px-5 py-4">
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full" 
                                  th:text="${#sets.size(course.students)}">0</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(courses)}">
                        <td colspan="4" class="px-5 py-6 text-center text-gray-500 italic">No courses added to the catalog yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
