<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Course Enrollment Form</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Enroll Student in Course</h2>
        
        <form th:action="@{/courses/enroll/save}" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Select Student</label>
                <select name="studentId" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="" disabled selected>-- Choose Student --</option>
                    <option th:each="student : ${students}" th:value="${student.id}" th:text="${student.name + ' (' + student.email + ')'}"></option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Select Course</label>
                <select name="courseId" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="" disabled selected>-- Choose Course --</option>
                    <option th:each="course : ${courses}" th:value="${course.id}" th:text="${course.courseCode + ' - ' + course.title}"></option>
                </select>
            </div>
            
            <div class="flex justify-between items-center pt-4">
                <a th:href="@{/courses}" class="text-gray-600 hover:underline text-sm">Cancel</a>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-6 rounded shadow">
                    Confirm Enrollment
                </button>
            </div>
        </form>
    </div>
</body>
</html>
