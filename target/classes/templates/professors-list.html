<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Faculty Directory</title>
    <!-- Corrected script pointer to target the live CDN script engine -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-8">

    <!-- Moved Navigation Ribbon inside the body block to ensure structural alignment -->
    <div class="container mx-auto max-w-5xl mb-6 flex justify-between items-center border-b bg-white p-4 rounded-lg shadow-sm">
        <div class="flex space-x-4">
            <a th:href="@{/}" class="text-gray-600 hover:text-blue-600 font-medium pb-2">Students</a>
            <a th:href="@{/professors}" class="text-blue-600 font-bold border-b-2 border-blue-600 pb-2">Faculty</a>
            <a th:href="@{/courses}" class="text-gray-600 hover:text-blue-600 font-medium pb-2">Courses</a>
        </div>
        <a th:href="@{/professors/add}" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow text-sm">
            + Add New Faculty
        </a>
    </div>

    <!-- Main Content Board Container -->
    <div class="container mx-auto max-w-5xl bg-white p-6 rounded-lg shadow-md">
        <div class="mb-6 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-800">Faculty Profiles</h1>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-200 rounded-lg overflow-hidden">
                <thead>
                    <tr class="bg-gray-800 text-white text-left text-sm uppercase tracking-wider">
                        <th class="px-5 py-3 border-b">ID</th>
                        <th class="px-5 py-3 border-b">Name</th>
                        <th class="px-5 py-3 border-b">Email</th>
                        <th class="px-5 py-3 border-b">Department</th>
                        <th class="px-5 py-3 border-b">Designation</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prof : ${professors}" class="border-b border-gray-200 hover:bg-gray-50 text-gray-700 transition">
                        <td class="px-5 py-4" th:text="${prof.id}">1</td>
                        <td class="px-5 py-4 font-medium" th:text="${prof.name}">Dr. Smith</td>
                        <td class="px-5 py-4" th:text="${prof.email}">smith@college.edu</td>
                        <td class="px-5 py-4" th:text="${prof.department}">Electronics</td>
                        <td class="px-5 py-4" th:text="${prof.designation}">HOD</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(professors)}">
                        <td colspan="5" class="px-5 py-6 text-center text-gray-500 italic">
                            No faculty profiles added yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
