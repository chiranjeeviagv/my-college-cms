# Server Port Configuration
server.port=8081

# Local H2 Database Connection Settings
spring.datasource.url=jdbc:h2:mem:collegedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console & Hibernate Setup
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Disable template caching for immediate changes
spring.thymeleaf.cache=false
# Allow loose HTML validation so template rendering does not fail
spring.thymeleaf.mode=HTML

